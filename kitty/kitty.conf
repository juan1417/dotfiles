# ═══════════════════════════════════════════════════════════
# FUENTE Y LIGATURAS (Nativo, sin hacks)
# ══════════════════════════════════════════════════════════
font_family      IosevkaCustom 
bold_font        Iosevka Custom Bold
italic_font      Iosevka Custom Italic
font_size        14.0
font_features    +liga +calt +ss01 +ss02 +ss03 +ss04 +ss05 +ss06 +ss07 +ss08

# ═══════════════════════════════════════════════════════════
# COLORES (Catppuccin Mocha Manual + Tu Naranja)
# ═══════════════════════════════════════════════════════════
foreground #cdd6f4
background #1e1e2e
selection_background #f5e0dc
selection_foreground #1e1e2e
url_color #89b4fa
cursor #ff6b35
cursor_text_color #1e1e2e
active_tab_foreground #1e1e2e
active_tab_background #ff6b35
inactive_tab_foreground #cdd6f4
inactive_tab_background #313244
active_border_color #ff6b35
inactive_border_color #313244
bell_border_color #f38ba8

color0 #45475a
color8 #585b70
color1 #f38ba8
color9 #f38ba8
color2 #a6e3a1
color10 #a6e3a1
color3 #f9e2af
color11 #f9e2af
color4 #89b4fa
color12 #89b4fa
color5 #cba6f7
color13 #cba6f7
color6 #94e2d5
color14 #94e2d5
color7 #bac2de
color15 #a6adc8

# ═══════════════════════════════════════════════════════════
# VENTANA Y COMPORTAMIENTO
# ═══════════════════════════════════════════════════════════
window_decorations none
window_padding_size 10
background_opacity 0.90
shell /usr/bin/fish
copy_on_select yes
enable_audio_bell no

# ═══════════════════════════════════════════════════════════
# PESTAÑAS (Ocultar para usar solo Hyprland)
# ═══════════════════════════════════════════════════════════
tab_bar_style hidden

# ═══════════════════════════════════════════════════════════
# ATAJOS ÚTILES
# ═══════════════════════════════════════════════════════════
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+r load_config_file
