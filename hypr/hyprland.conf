# This config is a STUB! This should never be generated.
# Use the default lua config from https://github.com/hyprwm/Hyprland/blob/main/example/hyprland.lua

exec-once = waybar
exec-once = mako


monitor=,preferred,auto,1


$mainMod = SUPER
$terminal = kitty
$fileManager = dolphin
$menu = wofi --show drun

# volumen
bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle

# brillo
bind = , XF86MonBrightnessup, exec, brightnessctl set +10%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 10%- 

bind = $mainMod, q, exec, $terminal
bind = $mainMod, w, killactive,
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, e, exec, $fileManager
bind = $mainMod, v, togglefloating,
bind = $mainMod, r, exec, $menu

input { 
	kb_layout=latam
	kb_options=caps:escape
    touchpad {
        natural_scroll=true
    }
}

# ═══════════════════════════════════════════════════════════
# GENERAL
# ═══════════════════════════════════════════════════════════
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(ff6b35ee) rgba(ff9f43ee) 45deg
    col.inactive_border = rgba(444444ee)
    layout = dwindle
}

# ═══════════════════════════════════════════════════════════
# DECORACIONES
# ═══════════════════════════════════════════════════════════
decoration {
    rounding = 8
    blur {
        enabled = true
        size = 3
        passes = 1
    }
    shadow {
        enabled = false
    }
}

# ═══════════════════════════════════════════════════════════
# DWINDLE LAYOUT
# ═══════════════════════════════════════════════════════════
dwindle {
    preserve_split = true
    smart_split = true
}

# ═══════════════════════════════════════════════════════════
# MOVIMIENTO DE VENTANAS
# ═══════════════════════════════════════════════════════════
bind = $mainMod, h, movefocus, l
bind = $mainMod, j, movefocus, d
bind = $mainMod, k, movefocus, u
bind = $mainMod, l, movefocus, r

bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, j, movewindow, d
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, l, movewindow, r

# ═══════════════════════════════════════════════════════════
# WORKSPACES
# ═══════════════════════════════════════════════════════════
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# ═══════════════════════════════════════════════════════════
# MISCELÁNEO
# ═══════════════════════════════════════════════════════════
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bind = $mainMod, p, pseudo,

# ═══════════════════════════════════════════════════════════
# SCREENSHOTS (Impr Pant / PrintScreen)
# ═══════════════════════════════════════════════════════════

# Super + Print -> Guardar Pantalla Completa
bind = $mainMod, Print, exec, ~/.config/hypr/scripts/screenshot.sh full

# Print (solo) -> Guardar Selección (Zona)
bind = , Print, exec, ~/.config/hypr/scripts/screenshot.sh area

# Ctrl + Print -> Copiar Pantalla Completa al Portapapeles
bind = $mainMod CTRL, Print, exec, grim -g "$(slurp -d)" - | wl-copy

# Shift + Print -> Abrir Editor (Satty) para dibujar
bind = $mainMod SHIFT, Print, exec, ~/.config/hypr/scripts/screenshot.sh edit
